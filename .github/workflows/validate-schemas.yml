name: Validate JSON schemas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install check-jsonschema==0.38.0
      - name: Validate JSON Schema meta-schemas
        run: check-jsonschema --check-metaschema Specification/schemas/*.schema.json
      - name: Validate repository metadata
        run: check-jsonschema --schemafile Specification/schemas/meta.schema.json rules/meta.json
      - name: Validate rule files
        run: find rules -type f -name '*.json' ! -path 'rules/meta.json' -print0 | xargs -0 -r check-jsonschema --schemafile Specification/schemas/rule-file.schema.json --base-uri "file://${PWD}/Specification/schemas/"
      - name: Validate OpenMath semantic closure
        run: python3 Specification/scripts/validate_semantic_closure.py rules
      - name: Validate test files
        run: find tests -type f -name '*.json' -print0 | xargs -0 -r check-jsonschema --schemafile Specification/schemas/test-file.schema.json --base-uri "file://${PWD}/Specification/schemas/"
      - name: Validate inference files
        run: find inferences -type f -name '*.json' -print0 | xargs -0 -r check-jsonschema --schemafile Specification/schemas/inference-file.schema.json --base-uri "file://${PWD}/Specification/schemas/"
      - name: Validate inference test files
        run: find inference-tests -type f -name '*.json' -print0 | xargs -0 -r check-jsonschema --schemafile Specification/schemas/inference-test-file.schema.json --base-uri "file://${PWD}/Specification/schemas/"
      - name: Validate global rule identifiers
        run: |
          duplicate_ids="$(find rules -type f -name '*.json' ! -path 'rules/meta.json' -print0 | xargs -0 -r jq -r '.rules[].id' | sort -n | uniq -d)"
          test -z "$duplicate_ids" || { echo "Duplicate rule identifiers: $duplicate_ids" >&2; exit 1; }
      - name: Test semantic verifier
        run: python3 scripts/test_verify_propositional_semantics.py
      - name: Verify propositional semantics
        run: python3 scripts/verify_propositional_semantics.py
